name: Build TWRP Recovery

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build TWRP
    runs-on: ubuntu-22.04
    steps:
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex \
          g++-multilib gcc-multilib git gnupg imagemagick lib32ncurses5-dev \
          lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-17-jdk python3 \
          repo libtinfo5
        sudo apt-get clean

    - name: Configure git
      run: |
        git config --global user.email "build@twrp.build"
        git config --global user.name "TWRP Build"
        git config --global http.postBuffer 524288000

    - name: Init TWRP manifest
      run: |
        mkdir twrp && cd twrp
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11

    - name: Add device tree via roomservice
      run: |
        cd twrp
        mkdir -p .repo/local_manifests
        printf '%s\n' '<manifest>' '  <project path="device/generic/recovery_dump" name="${{ github.repository }}" remote="github" revision="main" />' '</manifest>' > .repo/local_manifests/roomservice.xml
        cat .repo/local_manifests/roomservice.xml

    - name: Sync sources
      run: |
        cd twrp
        repo sync -c --no-clone-bundle -j$(nproc) --force-sync

    - name: Build recovery
      run: |
        cd twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        . build/envsetup.sh
        lunch omni_recovery_dump-eng
        mka recoveryimage -j$(nproc)

    - name: Find output
      id: find_output
      run: |
        RECOVERY=$(find twrp/out -name "recovery.img" -type f 2>/dev/null | head -1)
        if [ -z "$RECOVERY" ]; then
          RECOVERY=$(find twrp/out -name "*recovery*.img" -type f 2>/dev/null | head -1)
        fi
        echo "recovery_path=$RECOVERY" >> $GITHUB_OUTPUT
        echo "Found recovery: $RECOVERY"
        ls -la "$RECOVERY" 2>/dev/null || echo "File not found!"

    - name: Upload Recovery Image
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: TWRP-Recovery
        path: ${{ steps.find_output.outputs.recovery_path }}

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: twrp-${{ github.run_number }}
        name: TWRP Build ${{ github.run_number }}
        files: ${{ steps.find_output.outputs.recovery_path }}
        make_latest: true
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
